apis:
  - aid: tango:raas-api
    name: Tango RaaS API
    description: The Tango Rewards-as-a-Service (RaaS) API v2 is a RESTful interface for automating digital reward and incentive
      delivery. It enables customers to manage accounts and funding, browse a global reward catalog, place and manage orders,
      configure digital email templates, and receive webhook notifications. The API supports both sandbox and production environments.
    humanURL: https://developers.tangocard.com/
    baseURL: https://api.tangocard.com/raas/v2
