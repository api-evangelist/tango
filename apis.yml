aid: tango
name: Tango
description: >-
  Tango (formerly Tango Card) is a rewards-as-a-service platform that provides APIs for automating digital reward and
  incentive delivery. The Tango RaaS API enables companies to integrate a global catalog of 3,100+ digital gift cards,
  prepaid cards, and charitable donations directly into their products and workflows. Tango serves loyalty programs,
  research panels, employee recognition platforms, and consumer incentive applications worldwide.
type: Index
