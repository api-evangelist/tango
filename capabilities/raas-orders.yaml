naftiko: 1.0.0-alpha2
info:
  label: Tango RaaS API — Orders
  description: 'Tango RaaS API — Orders. 4 operations. Lead operation: List Orders. Self-contained Naftiko capability covering
    one Tango business surface.'
  tags:
  - Tango
  - Orders
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TANGO_API_KEY: TANGO_API_KEY
capability:
  consumes:
  - type: http
    namespace: raas-orders
    baseUri: https://api.tangocard.com/raas/v2
    description: Tango RaaS API — Orders business capability. Self-contained, no shared references.
    resources:
    - name: orders
      path: /orders
      operations:
      - name: listorders
        method: GET
        description: List Orders
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: startDate
          in: query
          type: string
          description: Filter orders from this date
        - name: endDate
          in: query
          type: string
          description: Filter orders up to this date
        - name: elements
          in: query
          type: integer
          description: Number of results per page
        - name: offset
          in: query
          type: integer
          description: Pagination offset
      - name: createorder
        method: POST
        description: Create Order
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: orders-referenceOrderID
      path: /orders/{referenceOrderID}
      operations:
      - name: getorder
        method: GET
        description: Get Order
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: orders-referenceOrderID-resends
      path: /orders/{referenceOrderID}/resends
      operations:
      - name: resendorder
        method: POST
        description: Resend Order
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: basic
      username: '{{env.TANGO_USER}}'
      password: '{{env.TANGO_PASS}}'
  exposes:
  - type: rest
    namespace: raas-orders-rest
    port: 8080
    description: REST adapter for Tango RaaS API — Orders. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/orders
      name: orders
      description: REST surface for orders.
      operations:
      - method: GET
        name: listorders
        description: List Orders
        call: raas-orders.listorders
        with:
          startDate: rest.startDate
          endDate: rest.endDate
          elements: rest.elements
          offset: rest.offset
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createorder
        description: Create Order
        call: raas-orders.createorder
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/orders/{referenceorderid}
      name: orders-referenceorderid
      description: REST surface for orders-referenceOrderID.
      operations:
      - method: GET
        name: getorder
        description: Get Order
        call: raas-orders.getorder
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/orders/{referenceorderid}/resends
      name: orders-referenceorderid-resends
      description: REST surface for orders-referenceOrderID-resends.
      operations:
      - method: POST
        name: resendorder
        description: Resend Order
        call: raas-orders.resendorder
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: raas-orders-mcp
    port: 9090
    transport: http
    description: MCP adapter for Tango RaaS API — Orders. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-orders
      description: List Orders
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: raas-orders.listorders
      with:
        startDate: tools.startDate
        endDate: tools.endDate
        elements: tools.elements
        offset: tools.offset
      outputParameters:
      - type: object
        mapping: $.
    - name: create-order
      description: Create Order
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: raas-orders.createorder
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-order
      description: Get Order
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: raas-orders.getorder
      outputParameters:
      - type: object
        mapping: $.
    - name: resend-order
      description: Resend Order
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: raas-orders.resendorder
      outputParameters:
      - type: object
        mapping: $.
