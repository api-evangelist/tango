naftiko: 1.0.0-alpha2
info:
  label: Tango RaaS API — Customers
  description: 'Tango RaaS API — Customers. 3 operations. Lead operation: List Customers. Self-contained Naftiko capability
    covering one Tango business surface.'
  tags:
  - Tango
  - Customers
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TANGO_API_KEY: TANGO_API_KEY
capability:
  consumes:
  - type: http
    namespace: raas-customers
    baseUri: https://api.tangocard.com/raas/v2
    description: Tango RaaS API — Customers business capability. Self-contained, no shared references.
    resources:
    - name: customers
      path: /customers
      operations:
      - name: listcustomers
        method: GET
        description: List Customers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createcustomer
        method: POST
        description: Create Customer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: customers-customerIdentifier
      path: /customers/{customerIdentifier}
      operations:
      - name: getcustomer
        method: GET
        description: Get Customer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: basic
      username: '{{env.TANGO_USER}}'
      password: '{{env.TANGO_PASS}}'
  exposes:
  - type: rest
    namespace: raas-customers-rest
    port: 8080
    description: REST adapter for Tango RaaS API — Customers. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/customers
      name: customers
      description: REST surface for customers.
      operations:
      - method: GET
        name: listcustomers
        description: List Customers
        call: raas-customers.listcustomers
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createcustomer
        description: Create Customer
        call: raas-customers.createcustomer
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/customers/{customeridentifier}
      name: customers-customeridentifier
      description: REST surface for customers-customerIdentifier.
      operations:
      - method: GET
        name: getcustomer
        description: Get Customer
        call: raas-customers.getcustomer
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: raas-customers-mcp
    port: 9090
    transport: http
    description: MCP adapter for Tango RaaS API — Customers. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-customers
      description: List Customers
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: raas-customers.listcustomers
      outputParameters:
      - type: object
        mapping: $.
    - name: create-customer
      description: Create Customer
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: raas-customers.createcustomer
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-customer
      description: Get Customer
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: raas-customers.getcustomer
      outputParameters:
      - type: object
        mapping: $.
