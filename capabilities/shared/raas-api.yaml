naftiko: "1.0.0-alpha1"

info:
  label: "Tango RaaS API"
  description: "Tango Rewards-as-a-Service API v2 for automating digital reward and incentive delivery, including catalog access, account management, and order placement."
  tags:
    - Catalog Management
    - Digital Rewards
    - Gift Cards
    - Incentives
    - Loyalty
    - Rewards As A Service
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      TANGO_USERNAME: TANGO_USERNAME
      TANGO_PASSWORD: TANGO_PASSWORD

capability:
  consumes:
    - type: http
      namespace: tango-raas
      baseUri: https://api.tangocard.com/raas/v2
      description: "Tango RaaS API v2 for rewards and incentive automation"
      authentication:
        type: basic
        username: "{{TANGO_USERNAME}}"
        password: "{{TANGO_PASSWORD}}"
      resources:
        - name: customers
          path: /customers
          description: "Manage customer accounts in the Tango platform"
          operations:
            - name: list-customers
              method: GET
              description: "Retrieve all customers"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-customer
              method: POST
              description: "Create a new customer account"
              body:
                type: json
                data:
                  customerIdentifier: "{{tools.customerIdentifier}}"
                  displayName: "{{tools.displayName}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: customer-by-id
          path: /customers/{customerIdentifier}
          description: "Manage a specific customer"
          operations:
            - name: get-customer
              method: GET
              description: "Get customer details"
              inputParameters:
                - name: customerIdentifier
                  in: path
                  type: string
                  required: true
                  description: "Customer identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: accounts
          path: /customers/{customerIdentifier}/accounts
          description: "Manage accounts for a customer"
          operations:
            - name: list-customer-accounts
              method: GET
              description: "List all accounts for a customer"
              inputParameters:
                - name: customerIdentifier
                  in: path
                  type: string
                  required: true
                  description: "Customer identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-account
              method: POST
              description: "Create a new account for a customer"
              inputParameters:
                - name: customerIdentifier
                  in: path
                  type: string
                  required: true
                  description: "Customer identifier"
              body:
                type: json
                data:
                  accountIdentifier: "{{tools.accountIdentifier}}"
                  displayName: "{{tools.displayName}}"
                  currencyCode: "{{tools.currencyCode}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: account-by-id
          path: /customers/{customerIdentifier}/accounts/{accountIdentifier}
          description: "Manage a specific account"
          operations:
            - name: get-account
              method: GET
              description: "Get account details including current balance"
              inputParameters:
                - name: customerIdentifier
                  in: path
                  type: string
                  required: true
                  description: "Customer identifier"
                - name: accountIdentifier
                  in: path
                  type: string
                  required: true
                  description: "Account identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: catalog
          path: /catalogs
          description: "Access the global digital reward catalog"
          operations:
            - name: get-catalog
              method: GET
              description: "Retrieve the full reward catalog"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: orders
          path: /orders
          description: "Place and manage reward orders"
          operations:
            - name: list-orders
              method: GET
              description: "List all reward orders"
              inputParameters:
                - name: startDate
                  in: query
                  type: string
                  required: false
                  description: "Filter orders from this date"
                - name: endDate
                  in: query
                  type: string
                  required: false
                  description: "Filter orders up to this date"
                - name: elements
                  in: query
                  type: integer
                  required: false
                  description: "Number of results per page"
                - name: offset
                  in: query
                  type: integer
                  required: false
                  description: "Pagination offset"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-order
              method: POST
              description: "Place a new reward order"
              body:
                type: json
                data:
                  customerIdentifier: "{{tools.customerIdentifier}}"
                  accountIdentifier: "{{tools.accountIdentifier}}"
                  amount: "{{tools.amount}}"
                  utid: "{{tools.utid}}"
                  recipient: "{{tools.recipient}}"
                  sender: "{{tools.sender}}"
                  message: "{{tools.message}}"
                  sendEmail: "{{tools.sendEmail}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: order-by-id
          path: /orders/{referenceOrderID}
          description: "Manage a specific order"
          operations:
            - name: get-order
              method: GET
              description: "Get order details"
              inputParameters:
                - name: referenceOrderID
                  in: path
                  type: string
                  required: true
                  description: "Order reference ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: line-items
          path: /lineItems
          description: "View and manage order line items"
          operations:
            - name: list-line-items
              method: GET
              description: "List all order line items"
              inputParameters:
                - name: startDate
                  in: query
                  type: string
                  required: false
                  description: "Filter from date"
                - name: endDate
                  in: query
                  type: string
                  required: false
                  description: "Filter to date"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: exchange-rates
          path: /exchangerates
          description: "Reference data - currency exchange rates"
          operations:
            - name: get-exchange-rates
              method: GET
              description: "Get current exchange rates"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: reward-countries
          path: /rewardCountries
          description: "Reference data - countries where rewards are available"
          operations:
            - name: list-reward-countries
              method: GET
              description: "List all countries where rewards can be delivered"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: tango-raas-rest
      resources:
        - path: /v1/customers
          name: customers
          description: "Manage Tango customers"
          operations:
            - method: GET
              name: list-customers
              description: "List all customers"
              call: "tango-raas.list-customers"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-customer
              description: "Create a new customer"
              call: "tango-raas.create-customer"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/accounts
          name: accounts
          description: "Manage customer accounts"
          operations:
            - method: GET
              name: get-account
              description: "Get account details"
              call: "tango-raas.get-account"
              with:
                customerIdentifier: "rest.customerIdentifier"
                accountIdentifier: "rest.accountIdentifier"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/catalog
          name: catalog
          description: "Browse reward catalog"
          operations:
            - method: GET
              name: get-catalog
              description: "Get the full reward catalog"
              call: "tango-raas.get-catalog"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/orders
          name: orders
          description: "Place and manage orders"
          operations:
            - method: GET
              name: list-orders
              description: "List reward orders"
              call: "tango-raas.list-orders"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-order
              description: "Place a reward order"
              call: "tango-raas.create-order"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/line-items
          name: line-items
          description: "View order line items"
          operations:
            - method: GET
              name: list-line-items
              description: "List order line items"
              call: "tango-raas.list-line-items"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: tango-raas-mcp
      transport: http
      tools:
        - name: list-customers
          description: "List all customers in the Tango platform"
          hints:
            readOnly: true
            idempotent: true
          call: "tango-raas.list-customers"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-customer
          description: "Create a new Tango customer account"
          hints:
            readOnly: false
            idempotent: false
          call: "tango-raas.create-customer"
          with:
            customerIdentifier: "tools.customerIdentifier"
            displayName: "tools.displayName"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-account
          description: "Get account details including current balance"
          hints:
            readOnly: true
            idempotent: true
          call: "tango-raas.get-account"
          with:
            customerIdentifier: "tools.customerIdentifier"
            accountIdentifier: "tools.accountIdentifier"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-catalog
          description: "Get the full digital reward catalog with all available brands and products"
          hints:
            readOnly: true
            idempotent: true
          call: "tango-raas.get-catalog"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-orders
          description: "List reward orders placed through the account"
          hints:
            readOnly: true
            idempotent: true
          call: "tango-raas.list-orders"
          with:
            startDate: "tools.startDate"
            endDate: "tools.endDate"
            elements: "tools.elements"
            offset: "tools.offset"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-order
          description: "Place a new digital reward order, delivering a gift card or incentive to a recipient"
          hints:
            readOnly: false
            idempotent: false
          call: "tango-raas.create-order"
          with:
            customerIdentifier: "tools.customerIdentifier"
            accountIdentifier: "tools.accountIdentifier"
            amount: "tools.amount"
            utid: "tools.utid"
            recipient: "tools.recipient"
            sender: "tools.sender"
            message: "tools.message"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-order
          description: "Get details and status of a specific reward order"
          hints:
            readOnly: true
            idempotent: true
          call: "tango-raas.get-order"
          with:
            referenceOrderID: "tools.referenceOrderID"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-line-items
          description: "List all order line items with fulfillment details"
          hints:
            readOnly: true
            idempotent: true
          call: "tango-raas.list-line-items"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-exchange-rates
          description: "Get current currency exchange rates for all supported currencies"
          hints:
            readOnly: true
            idempotent: true
          call: "tango-raas.get-exchange-rates"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-reward-countries
          description: "List all countries where digital rewards can be delivered"
          hints:
            readOnly: true
            idempotent: true
          call: "tango-raas.list-reward-countries"
          outputParameters:
            - type: object
              mapping: "$."
